<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>好读</title>
    <link rel="stylesheet" href="popup.css">
    <script src="divider-color.js" defer></script>
    <script src="platform/chrome/popup.js" defer></script>
  </head>
  <body>
    <button id="reader-toggle" type="button" role="switch" aria-label="阅读辅助" aria-checked="false" disabled>
      <span id="reader-toggle-label">关闭</span>
      <span class="switch-controls">
        <span id="shortcut-hint" class="shortcut-hint" hidden><kbd id="reader-shortcut"></kbd></span>
        <span class="switch-track" aria-hidden="true"></span>
      </span>
    </button>
    <input id="divider-hue" type="range" min="0" max="360" step="1" value="0"
      aria-label="分隔线颜色" title="拖动调整分隔线颜色" disabled>
  </body>
</html>
