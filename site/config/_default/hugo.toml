# 默认占位；production 配置和正式发布命令提供实际 HTTPS 地址。
baseURL = 'https://example.org/'
title = '好读'
locale = 'zh-CN'
defaultContentLanguage = 'zh-cn'
enableRobotsTXT = true
disableKinds = ['taxonomy', 'term', 'RSS']
disableHugoGeneratorInject = true

[outputs]
  home = ['HTML']

[build.buildStats]
  enable = true

[module.hugoVersion]
  min = '0.158.0'
  extended = true
