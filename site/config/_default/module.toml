  target = "assets"

# A single source image for the README, GitHub preview and website share cards.
[[mounts]]
  source = "../release/assets/haodu-cover-1280x640.jpg"
  target = "assets/images/haodu-cover-1280x640.jpg"

# Share the extension's controls and appearance rules without loading its model.
[[mounts]]
  source = "../src/reader-controls.css"
  target = "assets/css/reader-controls.css"

[[mounts]]
  source = "../src/divider-color.js"
  target = "assets/js/haodu/divider-color.js"

[[mounts]]
  source = "../src/divider-width.js"
  target = "assets/js/haodu/divider-width.js"

## static
[[mounts]]
  source = "node_modules/@thulite/doks-core/static"
  target = "static"

[[mounts]]
  source = "static"
  target = "static"
