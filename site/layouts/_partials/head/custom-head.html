{{ if or (eq .Kind "404") (ne hugo.Environment "production") }}
  <meta name="robots" content="noindex">
{{ end }}
<meta name="super-reader" content="off">
{{- /* Thulite emits the image URLs; add dimensions and localized alternatives. */}}
{{- with resources.Get (index site.Params.images 0) }}
  <meta property="og:image:type" content="{{ .MediaType.Type }}">
  <meta property="og:image:width" content="{{ .Width }}">
  <meta property="og:image:height" content="{{ .Height }}">
  <meta property="og:image:alt" content="{{ i18n "socialImageAlt" }}">
  <meta name="twitter:image:alt" content="{{ i18n "socialImageAlt" }}">
{{- end }}
