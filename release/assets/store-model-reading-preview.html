<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <!-- The page runs the bundled model itself; prevent a second extension pass. -->
  <meta name="haodu" content="off">
  <title>好读模型切分截图</title>
  <link rel="stylesheet" href="../../src/content.css">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 80px 96px;
      background: #fff;
      color: #192b33;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    main { width: 100%; max-width: 1088px; }
    p { margin: 0; font-size: 40px; font-weight: 400; line-height: 1.85; }
  </style>
</head>
<body data-model-state="loading">
  <main>
    <!-- Source: six existing reading examples from the epoch 3/4 comparison
         (IDs 305, 306, 67, 70, 86, 69), joined without changing their wording.
         No manual dividers: use the current model and default confidence gate. -->
    <p id="passage">阅读一本书的时候我们常常会因为某个熟悉的细节想起自己的经历。真正困难的并不是记住所有答案而是学会提出能够推动思考的问题。如果文字能够在适当的位置稍作停顿，理解作者想要表达的意思就会轻松一些。只要保留原文内容并在合适的位置添加分隔线，就能帮助读者更快地看清句子的结构。阅读速度并不是越快越好，真正重要的是能否理解并记住所读到的内容。每天抽出一点时间阅读，长期坚持下来就会发现自己的理解能力有所提高。</p>
  </main>
  <script src="../../src/frontend/write.js"></script>
  <script>
    const passage = document.getElementById("passage");
    const node = passage.firstChild;
    const source = { node, parent: passage, text: node.nodeValue, start: 0, end: node.length };
    const worker = new Worker("../../src/inference-worker.js");
    function fail(message) {
      document.body.dataset.modelState = "error";
      console.error(message);
      worker.terminate();
    }
    worker.onmessage = ({ data }) => {
      if (data.error) { fail(data.error); return; }
      Haodu.addMarkers(source, data.offsetsByText[0], "../../src/content.css");
      passage.dataset.offsets = JSON.stringify(data.offsetsByText[0]);
      document.body.dataset.modelState = "ready";
      worker.terminate();
    };
    worker.onerror = (error) => fail(error.message);
    worker.postMessage({ id: 1, texts: [source.text] });
  </script>
</body>
</html>
